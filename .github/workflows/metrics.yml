name: GitHub Metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Generate Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # === PROFILE CONFIG ===
          user: nzaoo
          template: classic
          base: header, activity, community, repositories
          base_indepth: yes
          config_timezone: Asia/Ho_Chi_Minh
          config_display: large
          config_output: svg
          config_padding: 6%

          # === LANGUAGES ===
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_colors: github
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, bytes-size
          plugin_languages_ignored: html, css, scss, less, dockerfile, makefile, shell
          plugin_languages_categories: programming

          # === CONTRIBUTION CALENDAR ===
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # === CODING HABITS ===
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_facts: yes
          plugin_habits_trim: yes

          # === ACHIEVEMENTS ===
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_limit: 6

          # === RECENT ACTIVITY ===
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: push, issue, pr, release
          plugin_activity_visibility: public
          plugin_activity_timestamps: yes

          # === LINES OF CODE ===
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_repositories_limit: 4

          # === STARRED REPOS ===
          plugin_stars: yes
          plugin_stars_limit: 4

          # === FOLLOW-UP ===
          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_followup_indepth: yes

          # === TRAFFIC ===
          plugin_traffic: yes

          # === NOTABLE ===
          plugin_notable: yes
          plugin_notable_repositories: yes
          plugin_notable_from: organization
          plugin_notable_types: commit, pull_request

          # === OPTIMIZATION ===
          repositories_batch: 100
          optimize: css, xml, svg
          retries: 3
          retries_delay: 300
          retries_output_action: warning
          output_action: commit
          committer_branch: main
          committer_message: "chore: update metrics"
