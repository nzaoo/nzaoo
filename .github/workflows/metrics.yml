name: GitHub Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: nzaoo
          template: classic
          base: header, activity, community, repositories, metadata
          
          # Configuration
          config_timezone: Asia/Ho_Chi_Minh
          config_animated: yes
          config_display: large
          
          # Language statistics with detailed breakdown
          plugin_languages: yes
          plugin_languages_analysis_timeout: 60
          plugin_languages_categories: markup, programming, data
          plugin_languages_colors: github
          plugin_languages_details: bytes-size, percentage, lines
          plugin_languages_limit: 12
          plugin_languages_recent_categories: markup, programming, data
          plugin_languages_recent_days: 30
          plugin_languages_recent_load: 500
          plugin_languages_sections: most-used, recently-used
          plugin_languages_threshold: 0%
          
          # Isometric calendar (3D commit calendar)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # Activity tracking
          plugin_activity: yes
          plugin_activity_days: 30
          plugin_activity_filter: all
          plugin_activity_limit: 5
          plugin_activity_load: 500
          plugin_activity_visibility: all
          
          # Achievements
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          
          # Habits (coding habits chart)
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_from: 500
          
          # Notable contributions
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_repositories: yes
          
          # Lines of code changed
          plugin_lines: yes
          plugin_lines_history_limit: 3
          plugin_lines_repositories_limit: 8
          plugin_lines_sections: base, repositories, history
          
          # Traffic (views and clones)
          plugin_traffic: yes
          
          # Code snippet of the day
          plugin_code: yes
          plugin_code_days: 7
          plugin_code_lines: 15
          plugin_code_load: 500
          plugin_code_visibility: public
          
          # Stargazers growth chart
          plugin_stargazers: yes
          plugin_stargazers_charts: yes
          plugin_stargazers_charts_type: classic
          
          # Stars tracking
          plugin_stars: yes
          plugin_stars_limit: 8
          
          # Contributors
          plugin_contributors: yes
          plugin_contributors_base: ""
          plugin_contributors_head: master
          plugin_contributors_sections: contributors
          
          # Follow-up tracking
          plugin_followup: yes
          plugin_followup_sections: repositories, user
          
          # Reactions (emoji reactions)
          plugin_reactions: yes
          plugin_reactions_display: absolute
          plugin_reactions_limit: 500
          
          # People (followers/following)
          plugin_people: yes
          plugin_people_limit: 32
          plugin_people_size: 32
          plugin_people_types: followers, following
          
          # Repositories
          plugin_repositories: yes
          plugin_repositories_featured: nzaoo/featured-repo
          
          # Introduction
          plugin_introduction: yes
          plugin_introduction_title: yes
          
          # Skyline (3D contributions)
          plugin_skyline: yes
          plugin_skyline_frames: 120
          plugin_skyline_quality: 1
          plugin_skyline_year: current-year
          
          # Stock prices (if you have finance projects)
          plugin_stock: yes
          
          # WakaTime integration (requires API key)
          # plugin_wakatime: yes
          # plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
          # plugin_wakatime_days: 30
          # plugin_wakatime_sections: time, projects, projects-graphs, languages, languages-graphs, editors, os
          
          # Music (Spotify/Last.fm - requires auth)
          # plugin_music: yes
          # plugin_music_provider: spotify
          # plugin_music_token: ${{ secrets.SPOTIFY_TOKEN }}
          # plugin_music_limit: 8
          # plugin_music_mode: recent
          # plugin_music_played_at: yes
          
          # Pagespeed (website performance)
          # plugin_pagespeed: yes
          # plugin_pagespeed_url: https://yourdomain.com
          
          # RSS feed
          # plugin_rss: yes
          # plugin_rss_source: https://yourblog.com/feed.xml
          # plugin_rss_limit: 5
          
          # Stackoverflow stats
          # plugin_stackoverflow: yes
          # plugin_stackoverflow_user: your-stackoverflow-id
          # plugin_stackoverflow_sections: answers-top, questions-recent
          # plugin_stackoverflow_limit: 5
          
          # Twitter/X integration
          # plugin_tweets: yes
          # plugin_tweets_token: ${{ secrets.TWITTER_TOKEN }}
          # plugin_tweets_limit: 5
          
          # Anilist (anime/manga tracking)
          # plugin_anilist: yes
          # plugin_anilist_user: your-anilist-username
          # plugin_anilist_limit: 5
          # plugin_anilist_sections: favorites, watching
          
          # Steam gaming stats
          # plugin_steam: yes
          # plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
          # plugin_steam_user: your-steam-id
          # plugin_steam_sections: player, most-played, recently-played
          
          # Chess.com stats
          # plugin_chess: yes
          # plugin_chess_user: your-chess-username
          
          # LeetCode stats
          # plugin_leetcode: yes
          # plugin_leetcode_user: your-leetcode-username
          # plugin_leetcode_sections: solved, skills, recent
          
          # Output options
          committer_message: "Update GitHub metrics [skip ci]"
          optimize: css, xml, svg
