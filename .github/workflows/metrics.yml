name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Thông tin cơ bản
          user: nzaoo
          template: classic
          base: header, activity, community, repositories, metadata
          
          # Config với animation
          config_timezone: Asia/Ho_Chi_Minh
          config_output: github
          config_padding: 0, 8 + 11%
          config_animated: yes
          config_display: large
          
          # ═══════════════════════════════════════════════
          # 🎨 NGÔN NGỮ LẬP TRÌNH - ĐẦY ĐỦ & ĐẸP MẮT
          # ═══════════════════════════════════════════════
          plugin_languages: yes
          plugin_languages_ignored: html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell, gnuplot
          plugin_languages_limit: 10
          plugin_languages_sections: most-used
          plugin_languages_colors: github
          plugin_languages_threshold: 0%
          plugin_languages_indepth: no
          plugin_languages_analysis_timeout: 20
          plugin_languages_categories: markup, programming
          plugin_languages_details: bytes-size, percentage
          
          # ═══════════════════════════════════════════════
          # 📅 LỊCH 3D - ISOCALENDAR (HIỆU ỨNG ĐẸP)
          # ═══════════════════════════════════════════════
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # ═══════════════════════════════════════════════
          # 💻 THÓI QUEN CODING - VỚI BIỂU ĐỒ
          # ═══════════════════════════════════════════════
          plugin_habits: yes
          plugin_habits_from: 500
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_trim: no
          
          # ═══════════════════════════════════════════════
          # 📊 LINES OF CODE - LỊCH SỬ THAY ĐỔI
          # ═══════════════════════════════════════════════
          plugin_lines: yes
          plugin_lines_sections: base, repositories, history
          plugin_lines_repositories_limit: 8
          plugin_lines_history_limit: 3
          
          # ═══════════════════════════════════════════════
          # 🏆 ACHIEVEMENTS - THÀNH TỰU CHI TIẾT
          # ═══════════════════════════════════════════════
          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed
          plugin_achievements_limit: 10
          
          # ═══════════════════════════════════════════════
          # ⭐ STARS & STARGAZERS - BIỂU ĐỒ TĂNG TRƯỞNG
          # ═══════════════════════════════════════════════
          plugin_stars: yes
          plugin_stars_limit: 6
          
          plugin_stargazers: yes
          plugin_stargazers_charts: yes
          plugin_stargazers_charts_type: chartist
          plugin_stargazers_worldmap: yes
          plugin_stargazers_worldmap_token: ${{ secrets.METRICS_TOKEN }}
          
          # ═══════════════════════════════════════════════
          # 🎯 HOẠT ĐỘNG - THEO DÕI CHI TIẾT
          # ═══════════════════════════════════════════════
          plugin_activity: yes
          plugin_activity_days: 30
          plugin_activity_limit: 6
          plugin_activity_load: 500
          plugin_activity_filter: all
          plugin_activity_visibility: all
          plugin_activity_timestamps: yes
          
          # ═══════════════════════════════════════════════
          # 🌟 NOTABLE CONTRIBUTIONS
          # ═══════════════════════════════════════════════
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_types: commit
          plugin_notable_indepth: no
          plugin_notable_repositories: yes
          plugin_notable_self: no
          
          # ═══════════════════════════════════════════════
          # 📈 TRAFFIC - LƯỢT XEM & CLONE
          # ═══════════════════════════════════════════════
          plugin_traffic: yes
          
          # ═══════════════════════════════════════════════
          # 💬 REACTIONS - EMOJI TƯƠNG TÁC
          # ═══════════════════════════════════════════════
          plugin_reactions: yes
          plugin_reactions_limit: 500
          plugin_reactions_days: 30
          plugin_reactions_display: absolute
          plugin_reactions_details: count, percentage
          
          # ═══════════════════════════════════════════════
          # 👥 PEOPLE - FOLLOWERS & FOLLOWING
          # ═══════════════════════════════════════════════
          plugin_people: yes
          plugin_people_limit: 28
          plugin_people_size: 32
          plugin_people_types: followers, following
          plugin_people_identicons: yes
          plugin_people_shuffle: yes
          
          # ═══════════════════════════════════════════════
          # 🔥 FOLLOW-UP - THEO DÕI ISSUES/PR
          # ═══════════════════════════════════════════════
          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_followup_indepth: no
          
          # ═══════════════════════════════════════════════
          # 💡 CODE SNIPPET - ĐOẠN CODE NỔI BẬT
          # ═══════════════════════════════════════════════
          plugin_code: yes
          plugin_code_lines: 16
          plugin_code_load: 500
          plugin_code_days: 7
          plugin_code_visibility: public
          
          # ═══════════════════════════════════════════════
          # 🎭 INTRODUCTION - GIỚI THIỆU BẢN THÂN
          # ═══════════════════════════════════════════════
          plugin_introduction: yes
          plugin_introduction_title: yes
          
          # ═══════════════════════════════════════════════
          # 📦 REPOSITORIES - FEATURED REPOS
          # ═══════════════════════════════════════════════
          plugin_repositories: yes
          plugin_repositories_order: featured, pinned, starred, random
          
          # ═══════════════════════════════════════════════
          # 🏅 CONTRIBUTORS - ĐÓNG GÓP
          # ═══════════════════════════════════════════════
          plugin_contributors: yes
          plugin_contributors_base: ""
          plugin_contributors_head: master
          plugin_contributors_ignored: bot
          plugin_contributors_contributions: yes
          plugin_contributors_sections: contributors
          
          # ═══════════════════════════════════════════════
          # 📸 SCREENSHOT - PROJECTS (nếu có)
          # ═══════════════════════════════════════════════
          plugin_screenshot: no
          # plugin_screenshot_title: Featured Project
          # plugin_screenshot_url: https://your-project-url.com
          # plugin_screenshot_selector: body
          
          # Tối ưu hóa
          repositories_batch: 100
          optimize: css, xml, svg
          experimental_features: --optimize-svg
