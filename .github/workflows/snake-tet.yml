name: Snake Game Tết Edition

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-snake-tet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate Tết Snake Animation
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Create output directory
            const outputDir = 'dist';
            if (!fs.existsSync(outputDir)) {
              fs.mkdirSync(outputDir, { recursive: true });
            }
            
            // Generate Tết-themed SVG
            const width = 1200;
            const height = 400;
            const cellSize = 20;
            
            let svg = `<?xml version="1.0" encoding="UTF-8"?>
<svg width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes snakeMove {
        0% { transform: translateX(0); }
        100% { transform: translateX(${width - cellSize}px); }
      }
      @keyframes liXiFloat {
        0% { transform: translateY(0) rotate(0deg); opacity: 1; }
        100% { transform: translateY(-${height}px) rotate(360deg); opacity: 0; }
      }
      @keyframes treeWave {
        0%, 100% { transform: scaleX(1); }
        50% { transform: scaleX(1.1); }
      }
      .snake { animation: snakeMove 20s linear infinite; }
      .lixi { animation: liXiFloat 8s ease-in infinite; }
      .tree { animation: treeWave 3s ease-in-out infinite; }
    </style>
  </defs>
  
  <!-- Background Tết -->
  <rect width="${width}" height="${height}" fill="#1a1a2e"/>
  
  <!-- Decorative elements -->
  <text x="50" y="30" font-size="24" fill="#FFD700" font-weight="bold">🎉 Tết Coding 2025 🎉</text>
  
  <!-- Left Tree -->
  <g class="tree" transform="translate(30, 150)">
    <rect x="-5" y="80" width="10" height="60" fill="#8B4513"/>
    <polygon points="0,0 -40,50 40,50 -30,85 30,85 0,120" fill="#228B22"/>
    <circle cx="0" cy="20" r="8" fill="#FF0000"/>
    <circle cx="-20" cy="45" r="8" fill="#FFD700"/>
    <circle cx="20" cy="50" r="8" fill="#FF0000"/>
  </g>
  
  <!-- Right Tree -->
  <g class="tree" transform="translate(1170, 150)">
    <rect x="-5" y="80" width="10" height="60" fill="#8B4513"/>
    <polygon points="0,0 -40,50 40,50 -30,85 30,85 0,120" fill="#228B22"/>
    <circle cx="0" cy="20" r="8" fill="#FF0000"/>
    <circle cx="-20" cy="45" r="8" fill="#FFD700"/>
    <circle cx="20" cy="50" r="8" fill="#FF0000"/>
  </g>
  
  <!-- Snake (moving razzmatazz) -->
  <g class="snake">
    <circle cx="10" cy="200" r="10" fill="#00FF00" stroke="#00AA00" stroke-width="2"/>
    <circle cx="25" cy="200" r="9" fill="#00EE00"/>
    <circle cx="40" cy="200" r="8" fill="#00DD00"/>
    <circle cx="55" cy="200" r="7" fill="#00CC00"/>
  </g>
  
  <!-- Lucky Money (Lì Xì) falling from top -->
  <g class="lixi">
    <rect x="200" y="0" width="25" height="35" fill="#FF0000" stroke="#FFD700" stroke-width="2" rx="3"/>
    <text x="212" y="22" font-size="12" fill="#FFD700" font-weight="bold" text-anchor="middle">$</text>
  </g>
  
  <g class="lixi" style="animation-delay: 2s;">
    <rect x="400" y="0" width="25" height="35" fill="#FF0000" stroke="#FFD700" stroke-width="2" rx="3"/>
    <text x="412" y="22" font-size="12" fill="#FFD700" font-weight="bold" text-anchor="middle">$</text>
  </g>
  
  <g class="lixi" style="animation-delay: 4s;">
    <rect x="600" y="0" width="25" height="35" fill="#FF0000" stroke="#FFD700" stroke-width="2" rx="3"/>
    <text x="612" y="22" font-size="12" fill="#FFD700" font-weight="bold" text-anchor="middle">$</text>
  </g>
  
  <g class="lixi" style="animation-delay: 6s;">
    <rect x="800" y="0" width="25" height="35" fill="#FF0000" stroke="#FFD700" stroke-width="2" rx="3"/>
    <text x="812" y="22" font-size="12" fill="#FFD700" font-weight="bold" text-anchor="middle">$</text>
  </g>
  
  <g class="lixi" style="animation-delay: 1s;">
    <rect x="100" y="0" width="25" height="35" fill="#FF0000" stroke="#FFD700" stroke-width="2" rx="3"/>
    <text x="112" y="22" font-size="12" fill="#FFD700" font-weight="bold" text-anchor="middle">$</text>
  </g>
  
  <!-- Status Text -->
  <text x="${width/2}" y="${height - 20}" font-size="16" fill="#FFD700" text-anchor="middle" font-style="italic">
    Rắn ăn lì xì - Snake eating Lucky Money 🐍💰
  </text>
</svg>`;
            
            fs.writeFileSync(path.join(outputDir, 'snake-tet.svg'), svg);
            console.log('✅ Tết Snake animation generated successfully!');

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
